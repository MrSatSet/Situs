<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Daftar Jam ke Menit</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS & Konfigurasi -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* ==========================================================================
       1. Pengaturan Dasar & Latar Belakang Halaman
       ========================================================================== */
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 50%, #fce7f3 100%);
      transition: background 0.35s ease;
    }

    html.dark body {
      background: radial-gradient(circle at top left, #0c192c 0%, #070910 55%, #160a24 100%);
    }

    /* ==========================================================================
       2. Bingkai Utama Ponsel & Border Gradien Bersama
       ========================================================================== */
    .phone-frame::before,
    .conversion-row-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .phone-frame {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(244, 247, 254, 0.96) 100%);
      box-shadow: 0 20px 50px -12px rgba(79, 70, 229, 0.18), inset 0 0 0 1.5px rgba(255, 255, 255, 0.9);
      transition: all 0.35s ease;
    }

    html.dark .phone-frame {
      background: linear-gradient(180deg, #0b111e 0%, #0b0d17 50%, #120b1e 100%);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.12);
    }

    .phone-frame::before {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      opacity: 0.55;
    }

    html.dark .phone-frame::before {
      background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 45%, #d946ef 100%);
      opacity: 0.85;
    }

    /* ==========================================================================
       3. Tipografi Judul, Tombol Pengaturan & Header Kolom
       ========================================================================== */
    .title-gradient {
      background: linear-gradient(90deg, #0ea5e9 0%, #3b82f6 50%, #9333ea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    html.dark .title-gradient {
      background: linear-gradient(90deg, #22d3ee 0%, #38bdf8 45%, #d946ef 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.25));
    }

    .gear-button {
      background: linear-gradient(145deg, #ffffff, #e6ecf8);
      box-shadow: 5px 5px 12px rgba(163, 177, 198, 0.45), -4px -4px 10px rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    html.dark .gear-button {
      background: radial-gradient(circle at 30% 30%, #1d243b, #111524);
      box-shadow: 0 0 15px rgba(217, 70, 239, 0.35), inset 0 0 0 1.5px rgba(217, 70, 239, 0.65);
      border: none;
    }

    .col-pill {
      position: relative;
      border-radius: 9999px;
      padding: 2px;
      background: linear-gradient(90deg, #0ea5e9 0%, #6366f1 50%, #9333ea 100%);
      box-shadow: 0 6px 16px -4px rgba(99, 102, 241, 0.35);
    }

    .col-pill-inner {
      border-radius: 9999px;
      background: linear-gradient(90deg, #0284c7 0%, #4f46e5 55%, #7e22ce 100%);
      color: #ffffff;
    }

    html.dark .col-pill {
      background: linear-gradient(90deg, #22d3ee 0%, #3b82f6 50%, #d946ef 100%);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.25), 0 0 14px rgba(217, 70, 239, 0.2);
    }

    html.dark .col-pill-inner {
      background: #0d1322;
      color: #67e8f9;
      text-shadow: 0 0 8px rgba(103, 232, 249, 0.45);
    }

    /* ==========================================================================
       4. Kartu Konversi (Jam & Menit)
       ========================================================================== */
    .conversion-row-card {
      position: relative;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 14px rgba(148, 163, 184, 0.16);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .conversion-row-card::before {
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      opacity: 0.7;
    }

    html.dark .conversion-row-card {
      background: linear-gradient(90deg, rgba(16, 26, 43, 0.9) 0%, rgba(23, 18, 38, 0.9) 100%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    html.dark .conversion-row-card::before {
      background: linear-gradient(
        90deg,
        rgba(34, 211, 238, 0.65) 0%,
        rgba(99, 102, 241, 0.4) 50%,
        rgba(217, 70, 239, 0.65) 100%
      );
      opacity: 0.9;
    }

    .jam-box {
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(148, 163, 184, 0.22);
      border: 1px solid rgba(226, 232, 240, 0.9);
      color: #0f172a;
    }

    html.dark .jam-box {
      background: transparent;
      box-shadow: none;
      border: none;
      color: #f8fafc;
    }

    .menit-badge {
      background: linear-gradient(90deg, #0ea5e9 0%, #4f46e5 52%, #9333ea 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.32);
    }

    html.dark .menit-badge {
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    html.dark .menit-neon-cyan {
      color: #22d3ee;
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.45);
    }

    html.dark .menit-neon-magenta {
      color: #e879f9;
      text-shadow: 0 0 10px rgba(232, 121, 249, 0.45);
    }

    /* ==========================================================================
       5. Scrollbar & Popover Pengaturan
       ========================================================================== */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
      margin-block: 8px;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.55);
      border-radius: 9999px;
    }

    html.dark .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }

    .settings-popover {
      transform-origin: top right;
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s ease;
    }

    .settings-popover.closed {
      opacity: 0;
      transform: scale(0.92) translateY(-6px);
      visibility: hidden;
      pointer-events: none;
    }

    .settings-popover.open {
      opacity: 1;
      transform: scale(1) translateY(0);
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>

<body class="flex justify-center items-stretch sm:py-4 overflow-hidden">
  <!-- Kontainer Utama Tampilan Smartphone -->
  <main
    id="app-container"
    class="phone-frame w-full max-w-[420px] h-[100dvh] sm:h-[calc(100dvh-2rem)] sm:rounded-[2.25rem] flex flex-col overflow-hidden"
  >
    <!-- Bagian Header Aplikasi -->
    <header class="relative pt-6 pb-3 px-5 shrink-0">
      <div class="flex items-start justify-between gap-2">
        <!-- Judul Utama -->
        <div class="flex-1 pr-2">
          <h1
            class="title-gradient font-extrabold uppercase tracking-tight text-[1.6rem] sm:text-[1.72rem] leading-[1.15] select-none"
          >
            DAFTAR JAM<br />
            <span class="inline-flex items-center gap-2">
              <span>KE MENIT</span>
              <span
                class="inline-flex dark:hidden items-center justify-center w-6 h-6 rounded-full bg-white shadow-sm border border-indigo-100 text-indigo-500"
                aria-hidden="true"
              >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
                  <path
                    fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-13a.75.75 0 00-1.5 0v5c0 .414.336.75.75.75h4a.75.75 0 000-1.5h-3.25V5z"
                    clip-rule="evenodd"
                  />
                </svg>
              </span>
            </span>
          </h1>
        </div>

        <!-- Tombol Pengaturan Tema -->
        <button
          id="settings-btn"
          type="button"
          aria-label="Pengaturan Tema"
          aria-expanded="false"
          aria-haspopup="true"
          class="gear-button w-11 h-11 rounded-full flex items-center justify-center shrink-0 active:scale-95 transition-transform duration-200 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        >
          <svg
            id="gear-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="w-6 h-6 text-slate-600 dark:text-fuchsia-400 transition-transform duration-300"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Menu Popover Pengaturan Tema -->
      <div
        id="settings-menu"
        role="menu"
        aria-labelledby="settings-btn"
        class="settings-popover closed absolute top-[4.5rem] right-5 z-30 w-56 rounded-2xl bg-white/95 dark:bg-[#13192b]/95 backdrop-blur-md border border-indigo-100 dark:border-cyan-500/30 shadow-2xl p-2"
      >
        <div
          class="px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 select-none"
        >
          Tampilan Tema
        </div>

        <!-- Daftar Opsi Tema (Dirender dinamis melalui JS untuk mencegah duplikasi markup) -->
        <div id="theme-options-container" class="space-y-1 mt-1"></div>
      </div>

      <!-- Header Dua Kolom ("Jam" dan "Menit") -->
      <div class="grid grid-cols-2 gap-3.5 mt-4">
        <div class="col-pill">
          <div class="col-pill-inner py-1.5 text-center font-bold text-sm sm:text-base tracking-wide select-none">
            Jam
          </div>
        </div>
        <div class="col-pill">
          <div class="col-pill-inner py-1.5 text-center font-bold text-sm sm:text-base tracking-wide select-none">
            Menit
          </div>
        </div>
      </div>
    </header>

    <!-- Daftar Kartu Konversi (1 - 24 Jam) -->
    <section
      aria-label="Daftar Konversi Jam ke Menit"
      class="custom-scroll flex-1 min-h-0 overflow-y-auto px-4 pt-1 pb-5"
    >
      <div id="conversion-list" class="space-y-2.5"></div>
    </section>
  </main>

  <script>
    /**
     * Aplikasi Daftar Jam ke Menit
     * Mengelola rendering kartu konversi 1-24 jam serta pergantian tema Light/Dark Mode.
     */
    (function () {
      'use strict';

      const THEME_STORAGE_KEY = 'daftar_jam_ke_menit_theme_v2';
      const TOTAL_HOURS = 24;
      const MINUTES_PER_HOUR = 60;
      const CYAN_THRESHOLD_HOUR = 15;

      // Referensi Elemen DOM
      const dom = {
        html: document.documentElement,
        conversionList: document.getElementById('conversion-list'),
        settingsBtn: document.getElementById('settings-btn'),
        gearIcon: document.getElementById('gear-icon'),
        settingsMenu: document.getElementById('settings-menu'),
        themeOptionsContainer: document.getElementById('theme-options-container'),
      };

      // Konfigurasi Opsi Tema
      const THEME_OPTIONS = [
        {
          id: 'dark',
          label: 'Dark Mode',
          icon: '🌙',
          activeClasses: ['bg-cyan-500/10', 'text-cyan-300', 'font-semibold'],
          badgeClasses: 'bg-cyan-500/20 text-cyan-400',
        },
        {
          id: 'light',
          label: 'Light Mode',
          icon: '☀️',
          activeClasses: ['bg-indigo-50', 'text-indigo-600', 'font-semibold'],
          badgeClasses: 'bg-indigo-500/15 text-indigo-600',
        },
      ];

      let isMenuOpen = false;
      const themeButtons = new Map();

      /**
       * Merender tombol opsi tema secara dinamis dari konfigurasi THEME_OPTIONS
       */
      function renderThemeOptions() {
        const fragment = document.createDocumentFragment();

        THEME_OPTIONS.forEach((opt) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('role', 'menuitemradio');
          btn.setAttribute('aria-checked', 'false');
          btn.className =
            'w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-100 text-left transition-colors duration-200 hover:bg-indigo-50 dark:hover:bg-cyan-500/10';

          btn.innerHTML = `
            <span class="flex items-center gap-2.5">
              <span class="text-base leading-none" aria-hidden="true">${opt.icon}</span>
              <span>${opt.label}</span>
            </span>
            <span
              data-indicator
              class="hidden items-center justify-center w-5 h-5 rounded-full ${opt.badgeClasses} text-xs font-bold"
              aria-hidden="true"
            >✓</span>
          `;

          btn.addEventListener('click', () => {
            applyTheme(opt.id);
            toggleSettingsMenu(false);
          });

          themeButtons.set(opt.id, {
            btn,
            indicator: btn.querySelector('[data-indicator]'),
            activeClasses: opt.activeClasses,
          });

          fragment.appendChild(btn);
        });

        dom.themeOptionsContainer.replaceChildren(fragment);
      }

      /**
       * Mengambil tema tersimpan dari localStorage
       * @returns {'dark' | 'light'}
       */
      function getSavedTheme() {
        try {
          const saved = localStorage.getItem(THEME_STORAGE_KEY);
          return saved === 'light' || saved === 'dark' ? saved : 'dark';
        } catch {
          return 'dark';
        }
      }

      /**
       * Menyimpan tema pilihan ke localStorage
       * @param {'dark' | 'light'} theme
       */
      function saveTheme(theme) {
        try {
          localStorage.setItem(THEME_STORAGE_KEY, theme);
        } catch {
          // Abaikan jika penyimpanan diblokir browser
        }
      }

      /**
       * Menerapkan tema ke seluruh dokumen dan memperbarui status indikator menu
       * @param {'dark' | 'light'} theme
       */
      function applyTheme(theme) {
        dom.html.classList.toggle('dark', theme === 'dark');

        themeButtons.forEach(({ btn, indicator, activeClasses }, id) => {
          const isActive = id === theme;
          btn.setAttribute('aria-checked', String(isActive));
          activeClasses.forEach((cls) => btn.classList.toggle(cls, isActive));
          indicator.classList.toggle('hidden', !isActive);
          indicator.classList.toggle('inline-flex', isActive);
        });

        saveTheme(theme);
      }

      /**
       * Membuka atau menutup popover menu pengaturan
       * @param {boolean} [forceState]
       */
      function toggleSettingsMenu(forceState) {
        isMenuOpen = typeof forceState === 'boolean' ? forceState : !isMenuOpen;
        dom.settingsBtn.setAttribute('aria-expanded', String(isMenuOpen));

        dom.settingsMenu.classList.toggle('open', isMenuOpen);
        dom.settingsMenu.classList.toggle('closed', !isMenuOpen);
        dom.gearIcon.classList.toggle('rotate-90', isMenuOpen);
      }

      /**
       * Membuat elemen konektor panah titik antara kolom Jam dan Menit
       * @returns {HTMLDivElement}
       */
      function createConnectorElement() {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-center justify-center px-1.5 shrink-0 select-none';
        wrapper.setAttribute('aria-hidden', 'true');
        wrapper.innerHTML = `
          <svg width="20" height="12" viewBox="0 0 20 12" fill="none" xmlns="http://www.w3.org/2000/svg"
               class="text-indigo-400/70 dark:text-purple-400/65">
            <line x1="2" y1="6" x2="14" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="15.5" cy="6" r="2.2" fill="currentColor" />
          </svg>
        `;
        return wrapper;
      }

      /**
       * Membuat satu baris kartu konversi jam ke menit
       * @param {number} jam
       * @returns {HTMLDivElement}
       */
      function createConversionCard(jam) {
        const menit = jam * MINUTES_PER_HOUR;
        const darkNeonClass = jam <= CYAN_THRESHOLD_HOUR ? 'menit-neon-cyan' : 'menit-neon-magenta';

        const card = document.createElement('div');
        card.className = 'conversion-row-card flex items-center justify-between p-1.5 sm:p-2';

        const jamContainer = document.createElement('div');
        jamContainer.className =
          'jam-box w-[43%] py-2 px-3 rounded-xl text-center font-bold text-[1.05rem] sm:text-[1.12rem] tracking-tight whitespace-nowrap';
        jamContainer.textContent = `${jam} jam`;

        const connector = createConnectorElement();

        const menitWrapper = document.createElement('div');
        menitWrapper.className = 'w-[47%] flex justify-center';

        const menitBadge = document.createElement('span');
        menitBadge.className = `menit-badge ${darkNeonClass} w-full py-1.5 px-2.5 rounded-full text-center font-bold text-[0.95rem] sm:text-[1.02rem] tracking-tight whitespace-nowrap`;
        menitBadge.textContent = `${menit} menit`;

        menitWrapper.appendChild(menitBadge);
        card.append(jamContainer, connector, menitWrapper);

        return card;
      }

      /**
       * Merender seluruh daftar kartu konversi dari 1 jam hingga 24 jam
       */
      function renderConversionList() {
        try {
          const fragment = document.createDocumentFragment();
          for (let jam = 1; jam <= TOTAL_HOURS; jam++) {
            fragment.appendChild(createConversionCard(jam));
          }
          dom.conversionList.replaceChildren(fragment);
        } catch (error) {
          console.error('Gagal merender daftar konversi:', error);
        }
      }

      /**
       * Mendaftarkan semua event listener aplikasi
       */
      function bindEvents() {
        dom.settingsBtn.addEventListener('click', (event) => {
          event.stopPropagation();
          toggleSettingsMenu();
        });

        document.addEventListener('click', (event) => {
          if (
            isMenuOpen &&
            !dom.settingsMenu.contains(event.target) &&
            !dom.settingsBtn.contains(event.target)
          ) {
            toggleSettingsMenu(false);
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && isMenuOpen) {
            toggleSettingsMenu(false);
            dom.settingsBtn.focus();
          }
        });
      }

      // Inisialisasi Aplikasi
      renderThemeOptions();
      applyTheme(getSavedTheme());
      renderConversionList();
      bindEvents();
    })();
  </script>
</body>
</html>
